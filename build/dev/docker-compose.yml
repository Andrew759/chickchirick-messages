services:
  nginx-messages:
    build: ./build/dev/nginx
    ports:
      - '83:80'
    depends_on:
      - api-messages
    networks:
      - backend-messages
      - chickchirick-shared-network

  api-messages:
    build:
      context: .
      dockerfile: ./build/dev/Dockerfile
    ports:
      - "8083:8080"
      - "40002:40000" # Порт для подключения IDE к отладчику
      - "6062:6060" #Порт трассировщика
    cap_add:
      - SYS_PTRACE # Разрешает Delve управлять процессом
    security_opt:
      - "seccomp=unconfined" # Отключает фильтрацию системных вызовов
    depends_on:
      postgres-messages:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - backend-messages
      - chickchirick-shared-network
